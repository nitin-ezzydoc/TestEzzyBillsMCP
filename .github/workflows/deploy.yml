name: Deploy MCP

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ezzycontainer2

      - name: Build Docker image
        run: |
          docker build \
            -t ezzycontainer2-djdxbyffhya8cmha.azurecr.io/ezzybills-mcp:${{ github.sha }} \
            -f Dockerfile \
            .

      - name: Push Docker image
        run: |
          docker push \
            ezzycontainer2-djdxbyffhya8cmha.azurecr.io/ezzybills-mcp:${{ github.sha }}

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name ezzybills-mcp \
            --resource-group Default-SQL-EastAsia \
            --image ezzycontainer2-djdxbyffhya8cmha.azurecr.io/ezzybills-mcp:${{ github.sha }}

      - name: Allow the generated Azure hostname
        shell: bash
        run: |
          fqdn="$(az containerapp show \
            --name ezzybills-mcp \
            --resource-group Default-SQL-EastAsia \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          if [ -z "$fqdn" ]; then
            echo "The Container App did not return a public hostname."
            exit 1
          fi

          az containerapp update \
            --name ezzybills-mcp \
            --resource-group Default-SQL-EastAsia \
            --set-env-vars \
              HOST=0.0.0.0 \
              PORT=3000 \
              "ALLOWED_HOSTS=$fqdn,mcp.ezzybills.com"

          echo "MCP endpoint: https://$fqdn/mcp"
